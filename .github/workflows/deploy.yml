name: Build & Deploy (OPTIMIZED VERSION)

on:
  push:
    branches: [ loiphan ]

jobs:
  build-and-test: # Tiêu chí: Gộp jobs (1 job)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Tiêu chí: Cache GHA cho Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Kích hoạt cache để tăng tốc cài đặt

      # Tiêu chí: Dùng npm ci thay vì npm install trong pipeline
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Cài đặt Docker Buildx (Bắt buộc để dùng tính năng cache của Docker)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tiêu chí: Dùng build-push-action + GHA cache
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha # Sử dụng cache từ Github Actions
          cache-to: type=gha,mode=max # Lưu cache cho các lần build sau